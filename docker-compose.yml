services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: shiftmanager
      POSTGRES_PASSWORD: shiftmanager
      POSTGRES_DB: shiftmanager
    volumes:
      - db-data:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U shiftmanager -d shiftmanager"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build: ./Backend
    depends_on:
      db:
        condition: service_healthy
    environment:
      ConnectionStrings__Default: Host=db;Port=5432;Database=shiftmanager;Username=shiftmanager;Password=shiftmanager
      Cors__AllowedOrigins__0: http://localhost:4200
    ports:
      - "5080:8080"
    restart: on-failure

volumes:
  db-data:
