server {
  listen 80;
  root /usr/share/nginx/html;
  index index.html;

  # El import admite hasta 5 MB; el límite fino lo valida la API.
  client_max_body_size 6m;

  location /api/ {
    proxy_pass http://api:8080;
    proxy_set_header Host $host;
  }

  location / {
    try_files $uri $uri/ /index.html;
  }
}
